services:
  savazai-db:
    image: pgvector/pgvector:pg17
    ports:
      - "5622:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-sz_harness_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sz_secure_vault_pass_99}
      POSTGRES_DB: ${DB_NAME:-savazai_harness}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${DB_USER:-sz_harness_admin} -d $${DB_NAME:-savazai_harness}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  savazai-backend:
    build: .
    ports:
      - "3055:3055"
    environment:
      DATABASE_URL: postgresql://${DB_USER:-sz_harness_admin}:${DB_PASSWORD:-sz_secure_vault_pass_99}@savazai-db:5432/${DB_NAME:-savazai_harness}
      NODE_ENV: ${NODE_ENV:-production}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME}
      MASTER_VAULT_SECRET: ${MASTER_VAULT_SECRET}
    depends_on:
      savazai-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "const http=require('http'); http.get('http://127.0.0.1:3055/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: always

  savazai-console:
    build:
      context: ./savazai-console
      dockerfile: Dockerfile
    ports:
      - "3056:3056"
    environment:
      DATABASE_URL: postgresql://${DB_USER:-sz_harness_admin}:${DB_PASSWORD:-sz_secure_vault_pass_99}@savazai-db:5432/${DB_NAME:-savazai_harness}
      NEXT_PUBLIC_HARNESS_API_URL: ${NEXT_PUBLIC_HARNESS_API_URL:-http://savazai-backend:3055}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-${NEXT_PUBLIC_APP_URL:-http://localhost:3056}}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-savazai_secure_auth_secret_development_vault_key_2026}
      NODE_ENV: ${NODE_ENV:-production}
    depends_on:
      savazai-db:
        condition: service_healthy
      savazai-backend:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "const http=require('http'); http.get('http://127.0.0.1:3056/signin', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: always

volumes:
  pgdata:
